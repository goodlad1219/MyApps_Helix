<!DOCTYPE html>
<html>
<head>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

    :root {
      --neon: #00ff41;           
      --neon-dim: rgba(0, 255, 65, 0.2);
      --danger: #ff003c;
      --cyan: #00e5ff; 
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Share Tech Mono', monospace;
      color: var(--neon);
      overflow: hidden;
      height: 100vh;
      background: transparent; 
      position: relative; 
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: rgba(0, 255, 65, 0.1); }
    ::-webkit-scrollbar-thumb { background: var(--neon); border-radius: 3px; }

    /* --- BASE WIDGET CONTAINER --- */
    #widget {
      background: transparent; 
      position: absolute;
      bottom: 10px; right: 10px; 
      width: 380px; height: 480px; /* Kept large so shadows and shapes don't clip */
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* --- IDLE & DIAL STATES (THE OMNITRIX CORE) --- */
    #widget.collapsed { width: 60px; height: 60px; border-radius: 50%; border: 2px solid var(--neon); box-shadow: 0 0 20px var(--neon); }
    #widget.collapsed.dial-active { width: 150px; height: 150px; border: 2px solid var(--neon); box-shadow: 0 0 30px var(--neon); background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); }

    /* --- ALARM STATE --- */
    @keyframes pulse-red-orb {
      0% { border-color: var(--danger); box-shadow: 0 0 30px var(--danger); }
      50% { border-color: #550000; box-shadow: 0 0 5px var(--danger); }
      100% { border-color: var(--danger); box-shadow: 0 0 30px var(--danger); }
    }
    #widget.collapsed.timer-alarm { animation: pulse-red-orb 1s infinite; }
    #widget.collapsed.timer-alarm #omnitrix-core { background: var(--danger); box-shadow: 0 0 20px var(--danger); }

    /* Drag Ring & Core */
    #omnitrix-casing { position: absolute; inset: 0; border: 15px solid rgba(0, 255, 65, 0.1); border-radius: 50%; -webkit-app-region: drag; z-index: 1; display: none; }
    #widget.collapsed #omnitrix-casing { display: block; }
    #widget.collapsed.dial-active #omnitrix-casing { display: none; }

    #omnitrix-core {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 24px; height: 24px; border-radius: 50%; background: var(--neon); box-shadow: 0 0 15px var(--neon);
      -webkit-app-region: no-drag; z-index: 10; cursor: pointer; display: none; pointer-events: auto; 
      transition: background 0.2s, box-shadow 0.2s, transform 0.2s;
    }
    #widget.collapsed #omnitrix-core { display: block; }
    #omnitrix-core:hover { transform: translate(-50%, -50%) scale(1.2); }
    #widget.collapsed.dial-active #omnitrix-core { background: #fff; box-shadow: 0 0 25px #fff; transform: translate(-50%, -50%) scale(0.8); }

    /* Dial Menu Quadrants */
    #dial-menu { position: absolute; inset: 0; z-index: 5; display: none; flex-direction: column; border-radius: 50%; overflow: hidden; animation: spin-in 0.3s ease-out forwards; }
    #widget.collapsed.dial-active #dial-menu { display: flex; }
    @keyframes spin-in { 0% { transform: rotate(-90deg) scale(0.5); opacity: 0; } 100% { transform: rotate(0deg) scale(1); opacity: 1; } }

    .quadrant { flex: 1; display: flex; justify-content: center; align-items: center; font-size: 14px; font-weight: bold; color: rgba(255,255,255,0.7); transition: 0.2s; border: 1px solid rgba(0, 255, 65, 0.2); -webkit-app-region: no-drag; cursor: pointer; }
    .quadrant:hover { background: rgba(0, 255, 65, 0.3); color: var(--neon); text-shadow: 0 0 10px var(--neon); box-shadow: inset 0 0 20px var(--neon); }

    /* --- EXPANDED UI VIEWS --- */
    #ui-content { width: 100%; height: 100%; display: none; flex-direction: column; }
    #widget.collapsed #ui-content { display: none; }
    
    .view { display: none; } /* Views are hidden by default */
    .btn { -webkit-app-region: no-drag; background: none; border: none; color: inherit; cursor: pointer; font-family: inherit; font-weight: bold; transition: 0.2s; outline: none; }
    .btn:hover { text-shadow: 0 0 8px currentColor; }

    /* =========================================
       VIEW 1: RECTANGULAR NOTES HUD 
       ========================================= */
    #view-notes.active { 
      display: flex; flex-direction: column; 
      width: 320px; height: 420px; 
      margin: auto; 
    }
    
    #drag-bar-notes {
      -webkit-app-region: drag; background: rgba(0, 0, 0, 0.6); border-radius: 4px; padding: 8px 10px;
      display: flex; justify-content: space-between; border: 1px solid var(--neon-dim); margin-bottom: 10px; color: var(--neon);
    }
    #drag-bar-notes .close-btn:hover { color: var(--danger); text-shadow: 0 0 8px var(--danger); }
    
    #task-list { flex: 1; overflow-y: auto; list-style: none; padding-right: 5px; background: rgba(0, 0, 0, 0.4); border-radius: 4px; padding: 10px; }
    #task-list li { padding: 5px 0; border-bottom: 1px dashed var(--neon-dim); word-wrap: break-word; cursor: crosshair; }
    #task-list li:hover { background: rgba(0, 255, 65, 0.1); }
    
    textarea { background: rgba(0, 0, 0, 0.6); border: 1px solid var(--neon-dim); color: var(--neon); font-family: inherit; resize: none; padding: 10px; outline: none; border-radius: 4px; margin-top:10px; }
    textarea:focus { box-shadow: 0 0 8px rgba(0, 255, 65, 0.4); border-color: var(--neon); }
    
    .status-bar { display: flex; justify-content: space-between; font-size: 12px; margin-top: 8px; background: rgba(0,0,0,0.6); padding: 5px 10px; border-radius: 4px; }


    /* =========================================
       VIEW 2: PERFECT CIRCULAR TIMER HUD
       ========================================= */
    #view-timer.active {
      display: flex; justify-content: center; align-items: center;
      width: 360px; height: 360px; margin: auto; flex: none;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.4) 100%);
      border: 1px solid rgba(0, 255, 65, 0.15); 
      box-shadow: 0 0 40px rgba(0, 255, 65, 0.05); 
      position: relative; overflow: hidden; -webkit-app-region: drag; 
    }

    .circle-controls { 
      position: absolute; width: 100%; top: 30px; 
      display: flex; justify-content: space-between; padding: 0 80px; z-index: 10; 
    }
    .circle-controls .btn:hover { color: var(--danger); }

    .timer-ring-container { 
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 280px; height: 280px;
      display: flex; justify-content: center; align-items: center; z-index: 5;
    }
    
    .progress-ring { position: absolute; transform: rotate(-90deg); }
    .progress-ring__track { stroke: rgba(0, 255, 65, 0.1); }
    .progress-ring__circle { stroke: var(--neon); stroke-linecap: round; transition: stroke-dashoffset 1s linear; }

    .timer-inner { 
      position: relative; z-index: 20; 
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      height: 200px; 
      -webkit-app-region: no-drag; 
    }

    /* Live Clock */
    .live-clock { display: flex; flex-direction: column; align-items: center; }
    #time-display { font-size: 22px; font-weight: bold; letter-spacing: 2px; text-shadow: 0 0 8px var(--neon); }
    #date-display { font-size: 11px; opacity: 0.7; letter-spacing: 1.5px; margin-top: 2px; }

    /* Custom Stepper Input */
    #setup-container { display: flex; flex-direction: column; align-items: center; gap: 5px; }
    .arrow-btn { 
      background: none; border: none; color: var(--neon); opacity: 0.5; 
      cursor: pointer; padding: 5px; transition: 0.2s; display: flex; align-items: center; justify-content: center;
    }
    .arrow-btn:hover { opacity: 1; transform: scale(1.2); text-shadow: 0 0 10px var(--neon); }
    .arrow-btn svg { width: 18px; height: 18px; fill: currentColor; }

    #timer-input { 
      background: transparent; border: none; color: #fff; 
      font-family: inherit; font-size: 42px; width: 80px; text-align: center; outline: none; 
      font-weight: bold; text-shadow: 0 0 10px rgba(255,255,255,0.3);
    }
    #timer-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    
    /* Countdown Display */
    @keyframes flash-text {
      0% { color: var(--danger); text-shadow: 0 0 20px var(--danger); }
      50% { color: #fff; text-shadow: none; }
      100% { color: var(--danger); text-shadow: 0 0 20px var(--danger); }
    }
    #countdown-display { 
      font-size: 48px; font-weight: bold; text-shadow: 0 0 15px var(--neon); 
      display: none; cursor: default; transition: 0.2s; line-height: 1; margin: 15px 0;
    }
    #countdown-display.alarm-active { animation: flash-text 1s infinite; cursor: pointer; }
    #countdown-display.alarm-active:hover { transform: scale(1.05); }

    /* SVG Icon Actions */
    .timer-actions { display: flex; gap: 25px; margin-top: 5px;}
    .icon-btn { 
      background: none; border: none; color: var(--neon); opacity: 0.7;
      cursor: pointer; transition: 0.2s; outline: none;
      display: flex; align-items: center; justify-content: center;
    }
    .icon-btn svg { width: 22px; height: 22px; fill: currentColor; }
    .icon-btn:hover { opacity: 1; transform: scale(1.15); filter: drop-shadow(0 0 8px var(--neon)); }

  </style>
</head>
<body>

  <div id="widget" class="collapsed">
    
    <div id="omnitrix-casing"></div>
    
    <div id="dial-menu">
      <div class="quadrant" onclick="openApp('notes')">NOTES</div>
      <div class="quadrant" onclick="openApp('timer')">TIMER</div>
    </div>

    <div id="omnitrix-core" onclick="handleCoreClick()"></div>

    <div id="ui-content">

      <div id="view-notes" class="view">
        <div id="drag-bar-notes">
          <span>// SYS.NOTES</span>
          <div>
            <button class="btn" onclick="toggleCollapse()">[-]</button>
            <button class="btn close-btn" onclick="window.close()">[X]</button>
          </div>
        </div>
        <ul id="task-list"></ul>
        <textarea id="task-input" rows="2" placeholder="> input_data_"></textarea>
        <div class="status-bar">
          <button class="btn" onclick="purge()">[PURGE]</button>
          <span>STATUS: ONLINE</span>
        </div>
      </div>

      <div id="view-timer" class="view">
        
        <div class="circle-controls">
          <button class="btn" onclick="toggleCollapse()">[-]</button>
          <button class="btn" onclick="window.close()">[X]</button>
        </div>

        <div class="timer-ring-container">
          <svg class="progress-ring" width="280" height="280">
            <circle class="progress-ring__track" stroke-width="4" fill="transparent" r="130" cx="140" cy="140"/>
            <circle class="progress-ring__circle" id="svg-ring" stroke-width="4" fill="transparent" r="130" cx="140" cy="140"/>
          </svg>
          
          <div class="timer-inner">
            
            <div class="live-clock">
              <div id="time-display">00:00 AM</div>
              <div id="date-display">LOADING...</div>
            </div>

            <div id="setup-container">
              <button class="arrow-btn" onclick="adjustTime(1)">
                <svg viewBox="0 0 24 24"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg>
              </button>
              
              <input type="number" id="timer-input" value="0" min="1" max="99">
              
              <button class="arrow-btn" onclick="adjustTime(-1)">
                <svg viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
              </button>
            </div>
            
            <div id="countdown-display" onclick="stopAlarm()">05:00</div>

            <div class="timer-actions">
              <button class="icon-btn" onclick="startTimer()" title="Start">
                <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
              </button>
              <button class="icon-btn" onclick="resetTimer()" title="Reset">
                <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
              </button>
            </div>

          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    const widget = document.getElementById('widget');
    const uiContent = document.getElementById('ui-content');
    
    let isAlarmRinging = false;

    // --- OMNITRIX & VIEW LOGIC ---
    function handleCoreClick() {
      // If the alarm is ringing, clicking the red core instantly opens the timer
      if (isAlarmRinging) {
        stopAlarm();
        openApp('timer');
      } else {
        // Otherwise, pop the dial menu
        toggleDial();
      }
    }

    function toggleDial() {
      if (!widget.classList.contains('collapsed')) return;
      widget.classList.toggle('dial-active');
    }

    function openApp(appId) {
      widget.classList.remove('collapsed', 'dial-active');
      uiContent.style.display = 'flex';
      
      // Hide all views, then show the requested one
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById(`view-${appId}`).classList.add('active');
    }

    function toggleCollapse() {
      widget.classList.add('collapsed');
      widget.classList.remove('dial-active'); 
      uiContent.style.display = 'none';
    }

    // --- NOTES LOGIC ---
    const input = document.getElementById('task-input');
    const list = document.getElementById('task-list');
    let tasks = JSON.parse(localStorage.getItem('neural_tasks')) || [];

    function renderTasks() {
      list.innerHTML = '';
      tasks.forEach((task, index) => {
        const li = document.createElement('li');
        li.innerText = `[++] ${task}`;
        li.ondblclick = () => { tasks.splice(index, 1); saveAndRender(); };
        list.appendChild(li);
      });
      list.scrollTop = list.scrollHeight; 
    }

    function saveAndRender() {
      localStorage.setItem('neural_tasks', JSON.stringify(tasks));
      renderTasks();
    }

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        const text = input.value.trim();
        if (text) { tasks.push(text); input.value = ''; saveAndRender(); }
      }
    });

    function purge() { tasks = []; saveAndRender(); }
    renderTasks();

    // --- LIVE CLOCK LOGIC ---
    function updateClock() {
      const now = new Date();
      let h = now.getHours();
      let m = now.getMinutes();
      const ampm = h >= 12 ? 'PM' : 'AM';
      h = h % 12 || 12; 
      m = m < 10 ? '0' + m : m;
      
      document.getElementById('time-display').innerText = `${h}:${m} ${ampm}`;
      
      const days = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];
      const months = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
      document.getElementById('date-display').innerText = `${days[now.getDay()]}, ${months[now.getMonth()]} ${now.getDate()}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // --- COUNTDOWN & SVG RING LOGIC ---
    const timerInput = document.getElementById('timer-input');
    const setupContainer = document.getElementById('setup-container');
    const countdownDisplay = document.getElementById('countdown-display');
    const circle = document.getElementById('svg-ring');
    
    const radius = circle.r.baseVal.value;
    const circumference = radius * 2 * Math.PI;
    circle.style.strokeDasharray = `${circumference} ${circumference}`;
    circle.style.strokeDashoffset = 0; 

    let countdownInterval;
    let totalSeconds = 0;
    let remainingSeconds = 0;
    let isRunning = false;

    // Custom Input Stepper Logic
    function adjustTime(amount) {
      if (isRunning) return;
      let currentVal = parseInt(timerInput.value);
      if (isNaN(currentVal)) currentVal = 1;
      
      let newVal = currentVal + amount;
      if (newVal < 1) newVal = 1;
      if (newVal > 99) newVal = 99;
      
      timerInput.value = newVal;
    }

    function formatTime(secs) {
      let m = Math.floor(secs / 60);
      let s = secs % 60;
      m = m < 10 ? '0' + m : m;
      s = s < 10 ? '0' + s : s;
      return `${m}:${s}`;
    }

    function setRingProgress(percent) {
      const offset = circumference - (percent * circumference);
      circle.style.strokeDashoffset = offset;
    }

    function startTimer() {
      if (isRunning || isAlarmRinging) return; 

      if (remainingSeconds === 0) {
        let mins = parseInt(timerInput.value);
        if (isNaN(mins) || mins <= 0) mins = 1;
        totalSeconds = mins * 60;
        remainingSeconds = totalSeconds;
      }

      setupContainer.style.display = 'none';
      countdownDisplay.style.display = 'block';
      countdownDisplay.innerText = formatTime(remainingSeconds);
      
      isRunning = true;

      countdownInterval = setInterval(() => {
        remainingSeconds--;
        
        countdownDisplay.innerText = formatTime(remainingSeconds);
        setRingProgress(remainingSeconds / totalSeconds);

        if (remainingSeconds <= 0) {
          triggerAlarm();
        }
      }, 1000);
    }

    function triggerAlarm() {
      clearInterval(countdownInterval);
      isRunning = false;
      isAlarmRinging = true;
      
      countdownDisplay.innerText = "TIME\nOVER"; 
      countdownDisplay.classList.add('alarm-active');
      circle.style.stroke = 'var(--danger)'; 
      
      widget.classList.add('timer-alarm');
    }

    function stopAlarm() {
      if (!isAlarmRinging) return;
      isAlarmRinging = false;
      
      countdownDisplay.classList.remove('alarm-active');
      widget.classList.remove('timer-alarm');
      
      resetTimer();
    }

    function resetTimer() {
      if (isAlarmRinging) stopAlarm();
      
      clearInterval(countdownInterval);
      isRunning = false;
      remainingSeconds = 0;
      
      setupContainer.style.display = 'flex';
      countdownDisplay.style.display = 'none';
      
      circle.style.stroke = 'var(--neon)';
      circle.style.transition = 'none'; 
      setRingProgress(1); 
      
      setTimeout(() => { circle.style.transition = 'stroke-dashoffset 1s linear'; }, 50);
    }
  </script>
</body>
</html>
