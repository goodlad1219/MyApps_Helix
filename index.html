<!DOCTYPE html>
<html>
<head>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

    :root {
      --bg: rgba(0, 0, 0, 0.45); 
      --neon: #00ff41;           
      --danger: #ff003c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Share Tech Mono', monospace;
      color: var(--neon);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: transparent; 
    }

    /* --- CYBERPUNK SCROLLBARS --- */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: rgba(0, 255, 65, 0.1); }
    ::-webkit-scrollbar-thumb { background: var(--neon); border-radius: 3px; }

    /* --- THE WIDGET --- */
    #widget {
      background: var(--bg);
      backdrop-filter: blur(12px);         
      -webkit-backdrop-filter: blur(12px); 
      border: 1px solid rgba(0, 255, 65, 0.3); 
      box-shadow: 0 0 15px rgba(0, 255, 65, 0.2), inset 0 0 10px rgba(0, 255, 65, 0.1);
      border-radius: 8px;
      width: 300px;
      height: 380px;
      display: flex;
      flex-direction: column;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
    }

    /* Collapsed State Class */
    #widget.collapsed {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid var(--neon);
      box-shadow: 0 0 20px var(--neon);
    }

    #drag-bar {
      -webkit-app-region: drag; 
      background: rgba(0, 255, 65, 0.15);
      padding: 8px 10px;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid rgba(0, 255, 65, 0.3);
    }
    
    .btn {
      -webkit-app-region: no-drag; 
      background: none;
      border: none;
      color: var(--neon);
      cursor: pointer;
      font-family: inherit;
      font-weight: bold;
      transition: 0.2s;
    }
    .btn:hover { text-shadow: 0 0 8px var(--neon); }
    .btn.close:hover { color: var(--danger); text-shadow: 0 0 8px var(--danger); }

    /* --- THE CORE (Fixed) --- */
    #core {
      display: none;
      width: 100%; 
      height: 100%;
      justify-content: center; 
      align-items: center;
      -webkit-app-region: drag; 
    }
    
    .solid-core {
      -webkit-app-region: no-drag; 
      pointer-events: auto; /* Forces Electron to see the mouse clicks */
      width: 24px;
      height: 24px;
      background-color: var(--neon);
      border-radius: 50%;
      box-shadow: 0 0 15px var(--neon);
      cursor: pointer;
      transition: all 0.2s ease-in-out;
    }

    .solid-core:hover {
      transform: scale(1.15);
      box-shadow: 0 0 25px var(--neon), 0 0 40px var(--neon);
      background-color: #33ff66;
    }

    #widget.collapsed #core { display: flex; }
    #widget.collapsed #ui-content { display: none; }

    #ui-content { flex: 1; display: flex; flex-direction: column; padding: 10px; overflow: hidden; }

    #task-list {
      flex: 1;
      overflow-y: auto; 
      list-style: none;
      margin-bottom: 10px;
      padding-right: 5px; 
    }

    #task-list li {
      padding: 5px 0;
      border-bottom: 1px dashed rgba(0, 255, 65, 0.3);
      word-wrap: break-word;
      cursor: crosshair;
    }
    #task-list li:hover { background: rgba(0, 255, 65, 0.1); }

    textarea {
      background: rgba(0, 0, 0, 0.3); 
      border: 1px solid rgba(0, 255, 65, 0.5);
      color: var(--neon);
      font-family: inherit;
      resize: none;
      padding: 8px;
      outline: none;
      border-radius: 4px;
    }
    textarea:focus { 
      box-shadow: 0 0 8px rgba(0, 255, 65, 0.4); 
      border-color: var(--neon);
    }

    .status-bar {
      display: flex; justify-content: space-between;
      font-size: 12px; margin-top: 8px; opacity: 0.8;
    }
  </style>
</head>
<body>

  <div id="widget" class="collapsed">
    
    <div id="core">
      <div class="solid-core" ondblclick="toggleCollapse()"></div>
    </div>

    <div id="ui-content">
      <div id="drag-bar">
        <span>// SYS.TRACKER</span>
        <div>
          <button class="btn" onclick="toggleCollapse()">[-]</button>
          <button class="btn close" onclick="window.close()">[X]</button>
        </div>
      </div>

      <ul id="task-list"></ul>

      <textarea id="task-input" rows="2" placeholder="> input_task_"></textarea>

      <div class="status-bar">
        <button class="btn" onclick="purge()">[PURGE]</button>
        <span>STATUS: ONLINE</span>
      </div>
    </div>
  </div>

  <script>
    const input = document.getElementById('task-input');
    const list = document.getElementById('task-list');
    const widget = document.getElementById('widget');

    let tasks = JSON.parse(localStorage.getItem('neural_tasks')) || [];

    function renderTasks() {
      list.innerHTML = '';
      tasks.forEach((task, index) => {
        const li = document.createElement('li');
        li.innerText = `[++] ${task}`;
        li.ondblclick = () => {
          tasks.splice(index, 1);
          saveAndRender();
        };
        list.appendChild(li);
      });
      list.scrollTop = list.scrollHeight; 
    }

    function saveAndRender() {
      localStorage.setItem('neural_tasks', JSON.stringify(tasks));
      renderTasks();
    }

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        const text = input.value.trim();
        if (text) {
          tasks.push(text);
          input.value = '';
          saveAndRender();
        }
      }
    });

    function purge() {
      tasks = [];
      saveAndRender();
    }

    function toggleCollapse() {
      widget.classList.toggle('collapsed');
    }

    renderTasks();
  </script>
</body>
</html>
